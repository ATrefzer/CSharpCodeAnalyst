name: Architecture guardrails

# Manual only, deliberately kept separate from the build/release pipeline (dotnet.yml).
# Trigger from the Actions tab ("Run workflow") once you want to check the current
# state of main (or any branch) against architecture.rules.txt.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore (helps MSBuild load the multi-project solution)
        run: dotnet restore CSharpCodeAnalyst.sln

      - name: Download C# Code Analyst (latest release)
        shell: pwsh
        run: |
          $url = "https://github.com/ATrefzer/CSharpCodeAnalyst/releases/latest/download/latest-release.zip"
          Invoke-WebRequest $url -OutFile codeanalyst.zip
          Expand-Archive codeanalyst.zip -DestinationPath tools/codeanalyst -Force

      - name: Validate architecture
        shell: pwsh
        run: |
          $outDir = "artifacts/codeanalyst"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exe = Get-ChildItem tools/codeanalyst -Filter CSharpCodeAnalyst.exe -Recurse | Select-Object -First 1

          $argList = @(
            "-validate",
            "-sln:$env:GITHUB_WORKSPACE\CSharpCodeAnalyst.sln",
            "-rules:$env:GITHUB_WORKSPACE\architecture.rules.txt",
            "-log-console",
            "-log-file:$env:GITHUB_WORKSPACE\$outDir\validation-log.txt",
            "-out:$env:GITHUB_WORKSPACE\$outDir\validation-result.txt"
          )

          # CSharpCodeAnalyst.exe is a WinExe (GUI subsystem). Calling it with the plain
          # `& $exe args` operator does not reliably block or propagate $LASTEXITCODE when
          # there is no attached console (as on a CI runner) - confirmed by testing.
          # Start-Process -Wait -PassThru is the reliable way to get both the exit code
          # and the console output back.
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $argList -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "$outDir\console-stdout.txt" `
            -RedirectStandardError "$outDir\console-stderr.txt"

          Get-Content "$outDir\console-stdout.txt" | Write-Host
          if ((Get-Item "$outDir\console-stderr.txt").Length -gt 0) {
            Get-Content "$outDir\console-stderr.txt" | Write-Host
          }

          # -validate exit codes: 0 = clean, 1 = violations, 2 = validation failed
          # (load/parse error).
          $code = $proc.ExitCode
          Write-Host "CSharpCodeAnalyst -validate exit code: $code"
          if ($code -ne 0) {
            exit $code
          }

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-validation
          path: artifacts/codeanalyst/
