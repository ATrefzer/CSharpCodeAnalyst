name: csharp-code-analyst-validate
description: >
  Download a C# Code Analyst release and run headless -validate on a solution.
  Windows runners only. Writes raw + parsed results to output-dir when requested
  (does not upload them as a GitHub Actions artifact, and does not upload the SARIF
  report either - add your own upload-artifact / upload-sarif steps for that, see
  samples/ci-pipeline/README.md).

inputs:
  solution:
    description: Path to the .sln relative to the workspace (or absolute).
    required: true
  rules:
    description: Path to the architectural rules text file.
    required: true
  output-dir:
    description: Directory for validation-result.txt, log, SARIF report, and parsed JSON.
    required: false
    default: artifacts/codeanalyst
  source-root:
    description: >
      Directory the file paths inside the SARIF report are made relative to - the directory the
      code was checked out into. Defaults to the workspace, which is correct for a normal
      checkout. Absolute runner paths would match no file in the consuming system.
    required: false
    default: ""
  release-asset-url:
    description: Zip URL for the desktop tool (default = latest release zip name used by upstream CI).
    required: false
    default: https://github.com/ATrefzer/CSharpCodeAnalyst/releases/latest/download/latest-release.zip
  parse-results:
    description: If true, run the sample parser into JSONL edges + handoff JSON.
    required: false
    default: "true"
  continue-on-violation:
    description: >
      If true (the default), violations do not fail this action - they are reported in the SARIF
      file and, once you upload it, as code scanning alerts. Only a failed analysis (exit code 2)
      fails the step. Set to false for the older behaviour of failing on violations too; prefer
      the "Code scanning results" check in branch protection to block a pull request.
    required: false
    default: "true"

outputs:
  sarif-file:
    description: Path of the written SARIF report, for a following upload-sarif step.
    value: ${{ steps.validate.outputs.sarif-file }}
  exit-code:
    description: The -validate exit code - 0 = clean, 1 = violations, 2 = validation failed.
    value: ${{ steps.validate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Ensure output directory
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ inputs.output-dir }}" | Out-Null

    - name: Download C# Code Analyst
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP "codeanalyst.zip"
        $dest = Join-Path $env:RUNNER_TEMP "codeanalyst"
        Invoke-WebRequest -Uri "${{ inputs.release-asset-url }}" -OutFile $zip
        if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
        Expand-Archive -Path $zip -DestinationPath $dest -Force
        $exe = Get-ChildItem -Path $dest -Filter CSharpCodeAnalyst.exe -Recurse | Select-Object -First 1
        if (-not $exe) { throw "CSharpCodeAnalyst.exe not found in release zip" }
        "CODEANALYST_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Run headless validation
      id: validate
      shell: pwsh
      run: |
        $out = Join-Path "${{ inputs.output-dir }}" "validation-result.txt"
        $log = Join-Path "${{ inputs.output-dir }}" "validation-log.txt"
        $sarif = Join-Path "${{ inputs.output-dir }}" "architecture.sarif"

        # The paths inside the SARIF report have to be relative to the checkout, or the
        # consuming system matches none of them. The workspace is that directory for a normal
        # checkout, so it is the default.
        $sourceRoot = "${{ inputs.source-root }}"
        if ([string]::IsNullOrWhiteSpace($sourceRoot)) { $sourceRoot = $env:GITHUB_WORKSPACE }
        $sln = if ([System.IO.Path]::IsPathRooted("${{ inputs.solution }}")) {
          "${{ inputs.solution }}"
        } else {
          Join-Path $env:GITHUB_WORKSPACE "${{ inputs.solution }}"
        }
        $rules = if ([System.IO.Path]::IsPathRooted("${{ inputs.rules }}")) {
          "${{ inputs.rules }}"
        } else {
          Join-Path $env:GITHUB_WORKSPACE "${{ inputs.rules }}"
        }
        # CSharpCodeAnalyst.exe is a WinExe (GUI subsystem). The plain `& $exe args` call
        # operator does not reliably wait or propagate the exit code when no console is
        # attached (the normal case on a CI runner). Start-Process -Wait -PassThru is the
        # reliable way to invoke it headlessly.
        $exeDir = Split-Path $env:CODEANALYST_EXE -Parent
        $stdoutPath = Join-Path "${{ inputs.output-dir }}" "console-stdout.txt"
        $stderrPath = Join-Path "${{ inputs.output-dir }}" "console-stderr.txt"
        $proc = Start-Process -FilePath $env:CODEANALYST_EXE -ArgumentList @(
          "-validate",
          "-sln:$sln",
          "-rules:$rules",
          "-log-console",
          "-log-file:$log",
          "-out:$out",
          "-source-root:$sourceRoot",
          "-sarif:$sarif"
        ) -WorkingDirectory $exeDir -NoNewWindow -Wait -PassThru `
          -RedirectStandardOutput $stdoutPath `
          -RedirectStandardError $stderrPath

        Get-Content $stdoutPath | Write-Host
        if ((Get-Item $stderrPath).Length -gt 0) {
          Get-Content $stderrPath | Write-Host
        }

        # -validate exit codes: 0 = clean, 1 = violations, 2 = validation failed (load/parse error).
        $code = $proc.ExitCode
        "CODEANALYST_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append
        "exit-code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "sarif-file=$sarif" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        # A failed analysis stops here - there is no result to parse or upload. Violations do
        # not fail this step: the findings are in the SARIF report, and failing here would skip
        # every following step, including the parse step, exactly when there is something to
        # parse. The opt-in failure happens in the last step instead.
        if ($code -eq 2) { exit 2 }

        if ($code -eq 1) {
          Write-Host "::warning::Architecture violations found - see the SARIF report or the code scanning alerts."
        }
        exit 0

    - name: Parse validation result
      if: inputs.parse-results == 'true'
      shell: pwsh
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH ".." "scripts" "parse_validation_result.py" | Resolve-Path
        $input = Join-Path "${{ inputs.output-dir }}" "validation-result.txt"
        $edges = Join-Path "${{ inputs.output-dir }}" "edges-codeanalyst.jsonl"
        $hand = Join-Path "${{ inputs.output-dir }}" "handoff-codeanalyst.json"
        if (-not (Test-Path $input)) {
          Write-Warning "No validation-result.txt to parse"
          exit 0
        }
        python $script --input $input --edges-out $edges --handoff-out $hand

    # Last, so that the result files and the parsed edges exist before the step can fail.
    - name: Fail on violations
      if: inputs.continue-on-violation != 'true'
      shell: pwsh
      run: |
        if ($env:CODEANALYST_EXIT -ne "0") {
          Write-Host "Failing because continue-on-violation is false and -validate returned $env:CODEANALYST_EXIT."
          exit [int]$env:CODEANALYST_EXIT
        }
